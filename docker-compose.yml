services:
  privacy-policy-viewer:
    build: .
    container_name: privacy-policies-app
    volumes:
      - ./policies:/app/policies
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
